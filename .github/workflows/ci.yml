name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: |
          dotnet restore Asteroids/Asteroids.csproj
          dotnet restore Asteroids.Tests/Asteroids.Tests.csproj

      - name: Build
        run: dotnet build Asteroids/Asteroids.csproj -c Release --no-restore

      - name: Test
        run: dotnet test Asteroids.Tests/Asteroids.Tests.csproj --no-restore --logger "console;verbosity=normal"
